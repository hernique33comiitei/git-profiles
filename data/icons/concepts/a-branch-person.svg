<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Concept A: git branch where the top node is a person (identity) -->
  <!-- branch structure -->
  <path d="M16 20 V35" fill="none" stroke="#3daee9" stroke-width="4" stroke-linecap="round"/>
  <path d="M16 25 C16 31 32 28 32 33" fill="none" stroke="#3daee9" stroke-width="4" stroke-linecap="round"/>
  <!-- bottom branch node -->
  <circle cx="16" cy="35" r="4.5" fill="#1d99f3"/>
  <!-- side branch node (new branch) in green -->
  <circle cx="32" cy="33" r="4.5" fill="#27ae60"/>
  <!-- person as the top node -->
  <circle cx="16" cy="12" r="5" fill="#1d99f3"/>
  <path d="M8.5 22 a7.5 7.5 0 0 1 15 0 Z" fill="#1d99f3"/>
</svg>
