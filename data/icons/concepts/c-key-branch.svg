<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Concept C: SSH key whose bow is a git branch node -->
  <!-- key ring / bow -->
  <circle cx="17" cy="17" r="9" fill="none" stroke="#3daee9" stroke-width="4"/>
  <!-- branch node inside the bow -->
  <circle cx="17" cy="17" r="3.5" fill="#27ae60"/>
  <!-- stem -->
  <path d="M23.5 23.5 L37 37" fill="none" stroke="#3daee9" stroke-width="4" stroke-linecap="round"/>
  <!-- teeth -->
  <path d="M31 31 l4.5 4.5" fill="none" stroke="#f67400" stroke-width="4" stroke-linecap="round"/>
  <path d="M27.5 34.5 l4 4" fill="none" stroke="#f67400" stroke-width="4" stroke-linecap="round"/>
</svg>
